[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-policy-kit"
version = "0.1.0"
description = "Building blocks for safe, read-only agent integrations: fail-closed scope, audit, secret masking, and a read-only connector base."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
keywords = ["ai-agent", "policy", "fail-closed", "audit", "secret-masking", "read-only", "mcp", "connector"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_policy_kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "examples"]
addopts = "-q"
