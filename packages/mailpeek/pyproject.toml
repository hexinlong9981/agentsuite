[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mailpeek"
version = "0.1.0"
description = "Read-only mailbox connector for AI agents: list/read/search/download over a pluggable backend, fail-closed folder allowlist, audited, secret-masked."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
keywords = ["email", "mailbox", "imap", "read-only", "ai-agent", "connector", "mcp"]
dependencies = ["agent-policy-kit"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mailpeek = "mailpeek.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mailpeek"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../agent-policy-kit/src"]
addopts = "-q"
