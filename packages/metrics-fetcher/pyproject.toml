[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "metrics-fetcher"
version = "0.1.0"
description = "Fetch time-series metrics from pluggable sources to CSV: auto granularity, contained output, read-only, audited."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
keywords = ["metrics", "time-series", "monitoring", "csv", "ai-agent", "mcp", "read-only"]
dependencies = ["agent-policy-kit"]

[project.optional-dependencies]
aws = ["boto3>=1.28"]
dev = ["pytest>=8"]

[project.scripts]
mfetch = "metrics_fetcher.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/metrics_fetcher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
