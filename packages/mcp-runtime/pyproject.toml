[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-runtime"
version = "0.1.0"
description = "Host agentsuite tools behind one MCP server: fail-closed tool manifest, audited dispatch, no credential-returning tools."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
keywords = ["mcp", "ai-agent", "runtime", "fail-closed", "audit", "hosting"]
dependencies = ["agent-policy-kit"]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
mcp-runtime = "mcp_runtime.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../agent-policy-kit/src"]
addopts = "-q"
