[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "procflow"
version = "0.0.1"
description = "Executable procedures (SOPs) for AI agents: author in YAML or Java, compile to one IR, validate, and run with code/human/LLM/agent steps, human gates, evidence capture, OOP (inheritance/interfaces/calls), scheduling, and a guard-railed self-improvement loop."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
keywords = ["ai-agent", "sop", "runbook", "workflow", "procedure", "fail-closed", "human-in-the-loop"]
dependencies = ["agent-policy-kit", "PyYAML>=6"]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
procflow = "procflow.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/procflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
