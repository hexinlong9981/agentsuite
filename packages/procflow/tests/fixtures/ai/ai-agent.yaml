sop:
  id: AI-AGENT
  name: One agent step
  version: "1.0"
flow:
  start: start
  inputs:
    - {id: topic, required: true}
steps:
  - {id: start, type: start}
  - id: build
    type: task
    mode: agent
    kind: agent
    action: Build the report and summarise it
    outputs: [report, status]
    io: {output_schema: report.json}
    agent: {task_class: build, needs: [fs-write], checks: ["status == 'built'"]}
  - {id: done, type: end, outcome: success}
transitions:
  - {id: T1, from: start, to: build}
  - {id: T2, from: build, to: done}
