sop:
  id: ROUNDS
  name: Review rounds with a ceiling
  version: "1.0"
flow:
  start: start
  execution: {max_rounds: 2}
steps:
  - {id: start, type: start}
  - id: draft
    type: task
    mode: auto
    action: Draft
  - id: review
    type: exclusive_choice
  - {id: done, type: end, outcome: success}
transitions:
  - {id: T1, from: start, to: draft}
  - {id: T2, from: draft, to: review}
  - {id: T3, from: review, to: draft, when: again, on_take: [round]}
  - {id: T4, from: review, to: done, when: ok}
