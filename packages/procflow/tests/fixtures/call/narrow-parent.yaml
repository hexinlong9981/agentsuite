sop:
  id: NARROW-PARENT
  name: Calls a child with a narrowing with_config
  version: "1.0"
flow:
  start: start
steps:
  - {id: start, type: start}
  - id: gate
    type: call
    sop: NARROW-CHILD
    reason: shows how the child's config is narrowed
    with_config: {retry.code: 0}
  - {id: done, type: end, outcome: success}
transitions:
  - {id: T1, from: start, to: gate}
  - {id: T2, from: gate, to: done}
