sop:
  id: GATED-CHILD
  name: A child that waits for a person
  version: "1.0"
interface:
  inputs:
    value: {type: string, required: true}
  outputs:
    verdict: {type: string}
  raises: []
flow:
  start: start
steps:
  - {id: start, type: start}
  - id: approve
    type: task
    mode: manual
    action: Approve the value
    outputs: [verdict]
  - {id: done, type: end, outcome: success}
transitions:
  - {id: T1, from: start, to: approve}
  - {id: T2, from: approve, to: done}
