[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentflow"
version = "0.1.0"
description = "Record an AI agent's run as append-only steps (JSONL) and render them; secrets masked, output contained."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
keywords = ["ai-agent", "observability", "trace", "run-log", "audit", "mcp"]
dependencies = ["agent-policy-kit"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
agentflow = "agentflow.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agentflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../agent-policy-kit/src"]
addopts = "-q"
