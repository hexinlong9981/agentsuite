[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chatpeek"
version = "0.1.0"
description = "Read-only chat connector for AI agents: list/read/search/download over a pluggable backend, fail-closed channel allowlist, audited, secret-masked."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
keywords = ["chat", "channel", "read-only", "ai-agent", "connector", "mcp"]
dependencies = ["agent-policy-kit"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
chatpeek = "chatpeek.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/chatpeek"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../agent-policy-kit/src"]
addopts = "-q"
